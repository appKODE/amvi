[versions]
koTest = "6.1.9"
ktlint = "1.8.0"
coroutines = "1.10.2"
# Should be equal to the Gradle embedded Kotlin version to prevent multiple Kotlin Compiler Daemon instances
kotlin = "2.3.20"
spotless = "8.4.0"
turbine = "1.2.1"
compose = "1.10.6"
# Compose Multiplatform for non-Android targets; on Android `compose` above wins
composeMultiplatform = "1.10.3"
agp = "9.0.1"
ksp = "2.3.6"
vanniktechMavenPublish = "0.37.0"
unicorn = "2.3.0"
compileSdk = "36"

[libraries]
kotest-junit-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "koTest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "koTest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "koTest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "koTest" }
ktlint = { module = "com.pinterest:ktlint", version.ref = "ktlint" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
unicorn = { module = "ru.kode:unicorn2", version.ref = "unicorn" }
composeRuntime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
composeRuntimeAnnotation = { module = "androidx.compose.runtime:runtime-annotation", version.ref = "compose" }
cmpRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }

[bundles]
koTestCommon = ["kotest-assertions-core", "kotest-property", "kotest-framework-engine"]
koTestJvm = ["kotest-junit-runner"]
coroutines = ["coroutines-core"]

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotest = { id = "io.kotest", version.ref = "koTest" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
