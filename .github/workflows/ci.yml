name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run ktlint (Spotless)
        run: ./gradlew --no-daemon --stacktrace spotlessCheck

      - name: Run tests and assemble validations
        run: |
          ./gradlew --no-daemon --stacktrace \
            :amvi-viewmodel:jvmTest \
            :amvi-viewmodel:assembleAndroidMain \
            :amvi-component-compose:jvmTest \
            :amvi-component-compose:assembleAndroidMain
